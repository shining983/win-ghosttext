name: Core tests

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Core
        run: dotnet test tests/WinGhostText.Core.Tests/WinGhostText.Core.Tests.csproj -c Release --verbosity minimal
